            playTone: (freq, type, duration, vol = 0.3) => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.start();

                                 allVoices.find(v => v.lang === 'en-US' && !v.name.includes("Chinese")) ||

            if (preferredVoice) u.voice = preferredVoice;

            });
            return tempDeck.sort(() => 0.5 - Math.random());
        }

        function flipCard() {
            if (lockBoard || this === firstCard) return;
            playSound('flip'); this.classList.add('flipped'); speakWord(this.dataset.word);
            if (!hasFlippedCard) { hasFlippedCard = true; firstCard = this; return; }
            secondCard = this; checkForMatch();
        }

function checkForMatch() {
            const g1 = firstCard.dataset.group;
            const g2 = secondCard.dataset.group;

            // 蹇呴爤鏄悓涓€鍊?Group ID 鎵嶈兘娑堥櫎
            if (g1 === g2) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function isSynonymPair(wordA, wordB) {
            if (!wordA || !wordB) return false;
            const wa = wordA.toLowerCase();
            const wb = wordB.toLowerCase();
            if (wa === wb) return true;
            for (let group of synonymData) {
                const wordsInGroup = group.words.map(w => (typeof w === 'string' ? w : w.t).toLowerCase());
                if (wordsInGroup.includes(wa) && wordsInGroup.includes(wb)) return true; 
            }
            return false;
        }

        function disableCards() {
            const c1 = firstCard;
            const c2 = secondCard;
            const color = c1.dataset.color || '#333';

            c1.removeEventListener('click', flipCard); 
            c2.removeEventListener('click', flipCard);

            setTimeout(() => {
                playSound('match'); 
                c1.classList.add('matched'); 
                c2.classList.add('matched');
                
                [c1, c2].forEach(c => {
                    const f = c.querySelector('.card-front');
                    const w = c.querySelector('.word-text');
                    const m = c.querySelector('.meaning-text');
                    f.setAttribute('style', `background-color:#fff!important; border:3px solid ${color}!important; color:${color}!important; transform:rotateY(180deg); box-shadow:inset 0 0 0 1px ${color}20;`);
                    w.style.color = color; 
                    if(m) m.style.cssText = `color:${color}!important; opacity:1!important; transform:translateY(0)!important; display:block!important;`;
                });
            }, 300);

            matchedPairs++;
            totalScore += 10; 
            updateUI(); 

            if (matchedPairs === 8) {
                clearInterval(timer);
                totalScore += remainingTime + (lives * 10);
                document.getElementById('total-score').innerText = totalScore;

                    playSound('victory');

                    initGame(true);
                }, 800);
            }
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true; 
            const c1 = firstCard;
            const c2 = secondCard;
            
            [c1, c2].forEach(c => {

        function calculateMyRank() {
            lastGameRank = "...";

// =========================================================
    // 馃 鎵撳瓧姗熺壒鏁堝嚱鏁?(绉绘鑷?N4 Game锛屽凡閬╅厤 Synonym Game)
    // =========================================================
    async function typeWriter(element, htmlContent, speed = 10) {
        element.innerHTML = '';
        // 纰轰繚鍏冪礌鍙涓旈珮搴﹁嚜鍕曪紝鏂逛究鎵撳瓧鏅傛拹闁?
        element.style.display = 'block';
        element.style.height = 'auto'; 
        
        // 1. 灏?HTML 瀛椾覆杞夊仛鐪熸鐨?DOM 绡€榛?
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const nodes = Array.from(tempDiv.childNodes);

        // 2. 閬炴鍑芥暩锛氳矤璨€愬堡鎵撳嵃
        async function typeNode(node, parent) {
            if (node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent;
                const textNode = document.createTextNode('');
                parent.appendChild(textNode);
                
                for (let i = 0; i < text.length; i++) {
                    textNode.textContent += text[i];
                    
                    // --- 鑷嫊鎹插嫊閭忚集 (閬╅厤 Modal) ---
                    // 鍢楄│鎼靛嚭鏈€杩戠殑鍙嵅鍕曞鍣?(Modal Content)
                    const scrollableParent = element.closest('.modal-content') || element.closest('.result-list-container');
                    if (scrollableParent) {
                        // 绨″柈鐗堬細鎵撳瓧鏅備繚鎸佹嵅杌稿湪鏈€搴曪紝纰轰繚鐫囧埌鏈€鏂板嚭鐨勫瓧
                        // 鍙湁鐣跺収瀹硅秴鍑烘檪鎵嶆嵅鍕?
                        if (scrollableParent.scrollHeight > scrollableParent.clientHeight) {
                             scrollableParent.scrollTop = scrollableParent.scrollHeight;
                        }
                    }

                    // 姣忎竴闅诲瓧鍋滈爴妤电煭鏅傞枔 (10ms 姣?N4 蹇皯灏戯紝鍥犵偤閫欓亰鎴茬瘈濂忚純蹇?
                    await new Promise(r => setTimeout(r, speed));
                }
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                // 铏曠悊妯欑堡 (h4, strong 绛?
                const el = document.createElement(node.tagName);
                Array.from(node.attributes).forEach(attr => {
                    el.setAttribute(attr.name, attr.value);
                });
                parent.appendChild(el);
                
                // 绻肩簩铏曠悊瀛愬収瀹?
                const children = Array.from(node.childNodes);
                for (const child of children) {
                    await typeNode(child, el);
                }
            }
        }

        // 3. 闁嬪鍩疯
        for (const node of nodes) {
            await typeNode(node, element);
        }
    }
