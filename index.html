            if (!entry) return '';

        function getMistakeReplayQueueRef() {
            if (!db || !currentPlayer) return null;
            return db.ref(`${USERS_PATH}/${currentPlayer}/mistakeReplayQueue`);

        function loadMistakeReplayQueue() {
            const queueRef = getMistakeReplayQueueRef();
            if (!queueRef) {
                mistakeReplayQueue = [];
                mistakeReplayQueueLoaded = true;
                return Promise.resolve(mistakeReplayQueue);
            }

            mistakeReplayQueueLoaded = false;

            return queueRef.once('value')
                .then(snapshot => {
                    const queue = snapshot.val();
                    mistakeReplayQueue = Array.isArray(queue) ? queue.filter(Boolean) : [];
                    mistakeReplayQueueLoaded = true;
                    return mistakeReplayQueue;

                .catch(error => {

                    mistakeReplayQueue = [];

            const queueRef = getMistakeReplayQueueRef();

            return queueRef.set(mistakeReplayQueue)

                mistakeReplayQueue.unshift(entry);
            });

            currentRunMistakeQueue = [];
            currentRunMistakeCounts = {};
            return saveMistakeReplayQueue();
        }

        function createPairFromGroup(group, preferredWord = null) {
            if (!group || !Array.isArray(group.words)) return null;

            const words = group.words
                .map(word => typeof word === 'string' ? { t: word, m: group.meaning } : { t: word.t, m: word.m || group.meaning })
                .filter(word => word.t);

            if (words.length < 2) return null;

            const normalizedPreferredWord = normalizeReplayWord(preferredWord);
            const anchorWord = normalizedPreferredWord
                ? words.find(word => normalizeReplayWord(word.t) === normalizedPreferredWord)
                : null;

            if (!anchorWord) {
                const shuffledWords = words.sort(() => 0.5 - Math.random());
                return { i1: shuffledWords[0], i2: shuffledWords[1], gid: group.id, c: group.color };
            }

            const partnerPool = words
                .filter(word => normalizeReplayWord(word.t) !== normalizedPreferredWord)
                .sort(() => 0.5 - Math.random());

            if (partnerPool.length === 0) return null;

            return { i1: anchorWord, i2: partnerPool[0], gid: group.id, c: group.color };
        }

        function takeMistakeReplayPairs(limit, excludedGroupIds = new Set()) {
            const replayPairs = [];
            const remainingQueue = [];

            mistakeReplayQueue.forEach(entry => {
                const groupId = typeof entry === 'string' ? entry : entry.gid;
                if (replayPairs.length >= limit || excludedGroupIds.has(groupId)) {
                    remainingQueue.push(entry);
                    return;
                }

                const group = synonymData.find(item => item.id === groupId);
                const preferredWord = typeof entry === 'string' ? null : entry.word;
                const pair = createPairFromGroup(group, preferredWord);

                if (pair) {
                    replayPairs.push(pair);
                    excludedGroupIds.add(groupId);
                } else {
                    remainingQueue.push(entry);
                }
            });

            mistakeReplayQueue = remainingQueue;
            saveMistakeReplayQueue();
            return replayPairs;
        }

        const cuteSfx = {
            // 基礎發聲函數 (已調大音量 vol 預設 0.3)
            playTone: (freq, type, duration, vol = 0.3) => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                // 音量控制：快速進入 -> 保持 -> 衰減
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            },
tick: () => {
                cuteSfx.playTone(800, 'triangle', 0.05, 0.3);
            },
            // 🖱️ UI Hover (像水滴聲，輕快)

                // 叮-龍！(C6 -> E6 -> G6) 更加興奮
                const now = audioCtx.currentTime;

            // 🎉 過關勝利 (Victory! 豪華版琶音)

                    }, i * 80);

            // 💀 Game Over
            gameover: () => {
                cuteSfx.playTone(300, 'sawtooth', 0.5, 0.4);
                setTimeout(() => cuteSfx.playTone(250, 'sawtooth', 0.5, 0.4), 400);
                setTimeout(() => cuteSfx.playTone(200, 'sawtooth', 1.0, 0.4), 800);
            }
        };

        (function initAutoSound() {

                const targets = document.querySelectorAll('button, .option-btn, .word-badge, .study-tag, .close-btn');

        function speakWord(text) {
            if (!('speechSynthesis' in window)) {

                return;
            }
            if (allVoices.length === 0) allVoices = window.speechSynthesis.getVoices();

            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            
            let preferredVoice = allVoices.find(v => v.name.includes("Google US English")) ||
                                 allVoices.find(v => v.name.includes("Google UK English Female")) ||
                                 allVoices.find(v => v.name.includes("Microsoft Zira")) ||
                                 allVoices.find(v => v.lang === 'en-US' && !v.name.includes("Chinese")) ||
                                 allVoices.find(v => v.lang === 'en-GB');

            if (preferredVoice) u.voice = preferredVoice;
            u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1;
            window.speechSynthesis.speak(u);
        }

        function shuffleArray(arr) {
            const cloned = [...arr];
            for (let i = cloned.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
            }
            return cloned;
        }

        function pickRandomItems(arr, count, excludeValues = new Set()) {
            return shuffleArray(arr.filter(item => !excludeValues.has(item))).slice(0, count);
        }

        function buildLearningLevels() {
            const levels = [];
            for (let start = 0; start < synonymData.length; start += 14) {
                const chunk = synonymData.slice(start, start + 14);
                const odd = chunk.filter((_, index) => index % 2 === 0);
                const even = chunk.filter((_, index) => index % 2 === 1);
                if (odd.length) levels.push(odd);
                if (even.length) levels.push(even);
            }
            return levels.slice(0, 30);
        }

        function toggleDailyReminder() {
            if (!('Notification' in window)) {
                alert("你的裝置/瀏覽器未支援通知功能。");
                return;
            }

            const enabled = localStorage.getItem(DAILY_REMINDER_KEY) === 'true';
            if (enabled) {
                localStorage.setItem(DAILY_REMINDER_KEY, 'false');
                clearTimeout(reminderTimeout);
                alert("已關閉每日提醒。");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission !== 'granted') {
                    alert("未能開啟通知權限。");
                    return;
                }
                localStorage.setItem(DAILY_REMINDER_KEY, 'true');
                scheduleDailyReminder();
                alert("已開啟提醒。提示：純 Web App 提醒受裝置與瀏覽器支援限制，如要穩定背景每日推播，之後仍建議接 push service。");
            });
        }

        function scheduleDailyReminder() {
            clearTimeout(reminderTimeout);
            if (localStorage.getItem(DAILY_REMINDER_KEY) !== 'true') return;
            if (!('Notification' in window) || Notification.permission !== 'granted') return;

            reminderTimeout = setTimeout(() => {
                new Notification('同義詞の鬼', {
                    body: '今日未練 synonym，花 5 分鐘玩一局學習模式啦。',
                    icon: 'icon.png'
                });
                localStorage.setItem(LAST_REMINDER_AT_KEY, String(Date.now()));
                scheduleDailyReminder();
            }, 24 * 60 * 60 * 1000);
        }

        function maybeShowComebackReminder() {
            if (localStorage.getItem(DAILY_REMINDER_KEY) !== 'true') return;
            if (!('Notification' in window) || Notification.permission !== 'granted') return;

            const lastActiveAt = Number(localStorage.getItem(LAST_ACTIVE_AT_KEY) || 0);
            const lastReminderAt = Number(localStorage.getItem(LAST_REMINDER_AT_KEY) || 0);
            const now = Date.now();

            if (lastActiveAt && now - lastActiveAt >= 24 * 60 * 60 * 1000 && now - lastReminderAt >= 12 * 60 * 60 * 1000) {
                new Notification('同義詞の鬼', {
                    body: '隔咗一日喇，返嚟推下一關 synonym 路線圖啦。',
                    icon: 'icon.png'
                });
                localStorage.setItem(LAST_REMINDER_AT_KEY, String(now));
            }
        }

        // --- 遊戲邏輯 ---

        function generateMasterDeck(excludedGroupIds = new Set(), sourceGroups = synonymData) {
            let tempDeck = [];
            sourceGroups.forEach(g => {
                if (excludedGroupIds.has(g.id)) return;
                let ws = g.words.map(w => (typeof w === 'string') ? {t:w, m:g.meaning} : {t:w.t, m:w.m});
                ws.sort(() => 0.5 - Math.random());
                for (let i = 0; i < ws.length - 1; i += 2) {
                    tempDeck.push({ i1: ws[i], i2: ws[i+1], gid: g.id, c: g.color });
                }
            });
            return tempDeck.sort(() => 0.5 - Math.random());
        }
        
        function initGame(isNextLevel = false) {
            if (!currentPlayer) return; 

            const grid = document.getElementById('gameGrid');
            grid.style.display = 'grid';
            grid.innerHTML = '';
            hasFlippedCard = false; lockBoard = false; firstCard = null; secondCard = null; matchedPairs = 0;
            
if (!isNextLevel) { 
        currentLevel = 1; totalScore = 0; lives = 10; // ✅ 10條命
        if (!useFiniteDeck) globalPairDeck = [];
        sessionHistory = []; 
        currentRunMistakeQueue = [];
        currentRunMistakeCounts = {};
    } else { // ✅ 修正：直接 else，唔好加多個 }
        currentLevel++; 
        lives = Math.min(lives + 3, 10); // ✅ 過關 +3 血
    }

            const sourceGroups = activeGameGroups || synonymData;

            if (!useFiniteDeck && globalPairDeck.length < 8) {
                const excludedGroupIds = new Set(globalPairDeck.map(pair => pair.gid));
                const replayPairs = takeMistakeReplayPairs(8 - globalPairDeck.length, excludedGroupIds);
                globalPairDeck = replayPairs.concat(globalPairDeck);

                if (globalPairDeck.length < 8) {
                    const freshPairs = generateMasterDeck(new Set(globalPairDeck.map(pair => pair.gid)), sourceGroups);
                    globalPairDeck = globalPairDeck.concat(freshPairs.slice(0, 8 - globalPairDeck.length));
                }
            }

            if (useFiniteDeck && globalPairDeck.length === 0) {
                clearInterval(timer);
                renderLearningCompletion();
                return;
            }

            updateUI(); resetTimer(); startTimer();

            const selectedPairs = globalPairDeck.splice(0, Math.min(8, globalPairDeck.length));
            pairsThisLevel = selectedPairs.length;

            sessionHistory.push({
                level: currentLevel,
                pairs: selectedPairs.map(p => ({
                    gid: p.gid,
                    words: [p.i1.t, p.i2.t], 
                    color: p.c,
                    meaning: p.i1.m
                }))
            });

            let deck = [];
            selectedPairs.forEach(p => {
                deck.push({t:p.i1.t, m:p.i1.m, gid:p.gid, c:p.c}, {t:p.i2.t, m:p.i2.m, gid:p.gid, c:p.c});
            });
            
            deck.sort(()=>0.5-Math.random());

deck.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('card');
                
                card.dataset.group = item.gid; 
                card.dataset.word = item.t; 
                card.dataset.color = item.c; 
                card.dataset.failCount = 1;

                const displayWord = item.t.charAt(0).toUpperCase() + item.t.slice(1);
                
                let hintLetter = "";

                if (item.t.charAt(1) === ' ') {
                    hintLetter = item.t.charAt(0).toUpperCase() + " " + item.t.charAt(2).toLowerCase();
                } else {
                    hintLetter = item.t.charAt(0).toUpperCase() + item.t.charAt(1).toLowerCase();
                }
                const textClass = item.t.length > 12 ? 'word-text long-text' : 'word-text';
                
                card.innerHTML = `<div class="card-inner">
                    <div class="card-front">
                        <div class="${textClass}">${displayWord}</div>
                        <div class="meaning-text">${item.m}</div>
                    </div>
                    <div class="card-back">${hintLetter}</div>
                </div>`;
                
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });

            setTimeout(() => { if(grid.children.length) grid.children[Math.floor(Math.random()*grid.children.length)].click(); }, 600);
        }

        function updateUI() {
            let h = ""; for(let i=0; i<lives; i++) h+="❤️";
            const l = document.getElementById('lives');
            l.innerText = h || "💀";
            l.className = lives<=2 ? "stat-box low-health" : "stat-box";
            document.getElementById('total-score').innerText = totalScore;
            document.getElementById('level-display').innerText = currentLevel;
        }

        function flipCard() {
            if (lockBoard || this === firstCard) return;
            playSound('flip'); this.classList.add('flipped'); speakWord(this.dataset.word);
            if (!hasFlippedCard) { hasFlippedCard = true; firstCard = this; return; }
            secondCard = this; checkForMatch();
        }

function checkForMatch() {
            const g1 = firstCard.dataset.group;
            const g2 = secondCard.dataset.group;

            // 必須是同一個 Group ID 才能消除
            if (g1 === g2) {
                disableCards();
            } else {
                unflipCards();
            }
        }

        function isSynonymPair(wordA, wordB) {
            if (!wordA || !wordB) return false;
            const wa = wordA.toLowerCase();
            const wb = wordB.toLowerCase();
            if (wa === wb) return true;
            for (let group of synonymData) {
                const wordsInGroup = group.words.map(w => (typeof w === 'string' ? w : w.t).toLowerCase());
                if (wordsInGroup.includes(wa) && wordsInGroup.includes(wb)) return true; 
            }
            return false;
        }

        function disableCards() {
            const c1 = firstCard;
            const c2 = secondCard;
            const color = c1.dataset.color || '#333';

            clearResolvedMistakeWords(
                { gid: c1.dataset.group, word: c1.dataset.word, color: color },
                { gid: c2.dataset.group, word: c2.dataset.word, color: color }
            );

            c1.removeEventListener('click', flipCard); 
            c2.removeEventListener('click', flipCard);

            setTimeout(() => {
                playSound('match'); 
                c1.classList.add('matched'); 
                c2.classList.add('matched');
                
                [c1, c2].forEach(c => {
                    const f = c.querySelector('.card-front');
                    const w = c.querySelector('.word-text');
                    const m = c.querySelector('.meaning-text');
                    f.setAttribute('style', `background-color:#fff!important; border:3px solid ${color}!important; color:${color}!important; transform:rotateY(180deg); box-shadow:inset 0 0 0 1px ${color}20;`);
                    w.style.color = color; 
                    if(m) m.style.cssText = `color:${color}!important; opacity:1!important; transform:translateY(0)!important; display:block!important;`;
                });
            }, 300);

            matchedPairs++;
            totalScore += 10; 
            updateUI(); 

            if (matchedPairs === pairsThisLevel) {
                clearInterval(timer);
                totalScore += remainingTime + (lives * 10);
                document.getElementById('total-score').innerText = totalScore;
                setTimeout(() => {
                    playSound('victory');
                    if (useFiniteDeck && globalPairDeck.length === 0) {
                        renderLearningCompletion();
                    } else {
                        alert(`🎉 Level ${currentLevel} Complete! 加番3個❤️俾你!\n總分: ${totalScore}`);
                        initGame(true);
                    }
                }, 800);
            }
            resetBoard();
        }

        function unflipCards() {
            lockBoard = true; 
            const c1 = firstCard;
            const c2 = secondCard;

            recordMistakeWords(
                { gid: c1.dataset.group, word: c1.dataset.word, color: c1.dataset.color },
                { gid: c2.dataset.group, word: c2.dataset.word, color: c2.dataset.color }
            );
            
            [c1, c2].forEach(c => {
                let cnt = parseInt(c.dataset.failCount||1)+1; 
                c.dataset.failCount = cnt;
                let w = c.dataset.word;
                let rawHint = w.substring(0, Math.min(cnt, w.length));
                let hint = rawHint.charAt(0).toUpperCase() + rawHint.slice(1);
                let b = c.querySelector('.card-back'); 
                if(b) {
                    b.innerText = hint;
                    b.style.fontSize = hint.length>3?'1rem':(hint.length>1?'1.5rem':'2.5rem');
                    b.style.background = "linear-gradient(135deg, #5b6ebf 0%, #683e91 100%)";
                }
            });

            lives--; 
            updateUI();

            if (lives === 0) {
                revealAndEndGame('HP 歸零'); 
                return;
            }

            setTimeout(() => { 
                playSound('fail'); 
                c1.classList.add('shake'); 
                c2.classList.add('shake'); 
            }, 400);
            
            setTimeout(() => { 
                c1.classList.remove('flipped','shake'); 
                c2.classList.remove('flipped','shake'); 
                resetBoard(); 
            }, 1200);
        }

        function resetBoard() { [hasFlippedCard, lockBoard] = [false, false]; [firstCard, secondCard] = [null, null]; }
        
function startTimer() {
            // 重置時間顯示顏色
            const timerDisplay = document.getElementById('timer');
            timerDisplay.style.color = ''; 
            
            remainingTime = timeLimit; 
            timerDisplay.innerText = remainingTime;

            timer = setInterval(() => {
                remainingTime--;

                    timerDisplay.classList.add('pulse-red'); // (如果有動畫class的話)
                } else if (remainingTime > 10) {
                    timerDisplay.style.color = ''; // 正常顏色
                }

                if (remainingTime <= 0) { 
                    revealAndEndGame('時間到'); 
                }
            }, 1000);
        }
        function resetTimer() { clearInterval(timer); remainingTime = timeLimit; document.getElementById('timer').innerText = remainingTime; }

        // --- 排行榜與分數 ---
        function autoSubmitScore(isSilent = false) {
            if (!currentPlayer) return;
            if (isLearningFlow()) return;
            
            if (totalScore === 0) {
                 if (!isSilent) {
                     alert("💀 Game Over! \n0分... 下次努力！");
                     backToLobby();
                 }
                 return;
            }

            db.ref(LEADERBOARD_PATH).push({
                name: currentPlayer,
                score: totalScore,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                calculateMyRank(); 
            });
        }


        function calculateMyRank() {
            lastGameRank = "..."; 
            
            db.ref(LEADERBOARD_PATH).orderByChild('score').once('value', snapshot => {
                let rawScores = [];
                snapshot.forEach(child => {
                    rawScores.push(child.val());
                });
                
                // --- 🔥 同樣應用過濾邏輯 ---
                const uniqueMap = {};
                rawScores.forEach(item => {
                    if (!uniqueMap[item.name] || item.score > uniqueMap[item.name].score) {
                        uniqueMap[item.name] = item;
                    }
                });
                
                // 轉成 Array 並排序
                let uniqueScores = Object.values(uniqueMap).sort((a, b) => b.score - a.score);

                // 找出自己在榜單中的位置
                let myRank = "未上榜";
                for (let i = 0; i < uniqueScores.length; i++) {
                    if (uniqueScores[i].name === currentPlayer) {
                        myRank = i + 1;
                        break;
                    }
                }
                
                lastGameRank = myRank;

                // 立即更新 UI (如果結果頁已經打開)
                const displayDiv = document.getElementById('resultPageRankDisplay');
                if (displayDiv) {
                    let rankText = (typeof myRank === 'number') ? `#${myRank}` : myRank;
                    
                    if(myRank == 1) rankText = "🏆 冠軍";
                    if(myRank == 2) rankText = "🥈 亞軍";
                    if(myRank == 3) rankText = "🥉 季軍";
                    
                    displayDiv.innerText = `本次排名: ${rankText}`;
                }
            });
        }

       function fetchLeaderboard() {
            const listBody = document.getElementById('rankListBody');
            const loading = document.getElementById('loadingRank');
            
            // 顯示載入中
            loading.style.display = 'block';
            listBody.innerHTML = '';

            // 獲取最後 100 筆數據
            db.ref(LEADERBOARD_PATH).orderByChild('score').once('value')
            .then(snapshot => {
                loading.style.display = 'none';
                
                let rawScores = [];
                snapshot.forEach(child => { rawScores.push(child.val()); });
                
                // 過濾重複名字，只留最高分
                const uniqueMap = {};
                rawScores.forEach(item => {
                    if (!uniqueMap[item.name] || item.score > uniqueMap[item.name].score) {
                        uniqueMap[item.name] = item;
                    }
                });

                // 排序
                let uniqueScores = Object.values(uniqueMap).sort((a, b) => b.score - a.score);

uniqueScores = uniqueScores.slice(0, 100);
                if(uniqueScores.length === 0) {
                    listBody.innerHTML = '<tr><td colspan="3" style="text-align:center;">暫無紀錄</td></tr>';
                    return;
                }

                uniqueScores.forEach((s, index) => {
                    const row = document.createElement('tr');
                    row.className = 'rank-row';
                    
                    let rankIcon = `<span class="rank-num">${index + 1}</span>`;
                    if(index===0) rankIcon = '🥇';
                    if(index===1) rankIcon = '🥈';
                    if(index===2) rankIcon = '🥉';

                    const isMe = (s.name === currentPlayer) ? 'background:#fffde7;' : '';

                    row.innerHTML = `
                        <td style="${isMe}">${rankIcon}</td>
                        <td class="rank-name" style="${isMe}">${s.name}</td>
                        <td class="rank-score" style="${isMe}">${s.score}</td>
                    `;
                    listBody.appendChild(row);
                });
            }) // 這裡正確閉合 .then
            .catch(err => {
                loading.innerText = "載入失敗";
                console.error(err);
            }); // 這裡正確閉合 .catch
        }

            markAppActivity();
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            if (id === 'rankModal' && lives <= 0) {
                backToLobby();
            }
        }

        function closeResultAndReset() {
            document.getElementById('resultModal').classList.add('hidden');
            backToLobby(); 
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                markAppActivity();
                maybeShowComebackReminder();
                scheduleDailyReminder();
            }
            if (document.visibilityState === 'hidden') {
                if (currentLevel > 0 && totalScore > 0 && document.getElementById('inGameButtons').style.display === 'flex') {
                    console.log("App hidden, auto saving score...");
                    autoSubmitScore(true);
                }
                markAppActivity();
            }
        });

        // 輔助函數：建立單字 Badge
        function createWordBadge(text, color, isActive) {
            const span = document.createElement('span');
            span.innerText = text;
            span.className = isActive ? 'word-badge active' : 'word-badge passive';
            if (isActive) span.style.backgroundColor = color;
            span.onclick = () => {
                speakWord(text);
                span.style.transform = "scale(0.9)";
                setTimeout(()=> span.style.transform = isActive ? "scale(1)" : "scale(1)", 100);
            };
            return span;
        }

function openStudyModal() {
            const container = document.getElementById('studyListContainer');
            container.innerHTML = '';
            
            const searchWrapper = document.getElementById('searchBarWrapper');
            const searchInput = document.getElementById('studySearchInput');
            if(searchWrapper) searchWrapper.classList.remove('open');
            if(searchInput) searchInput.value = '';

            synonymData.sort((a,b) => a.id.localeCompare(b.id));

            synonymData.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'study-group';
                groupDiv.style.borderLeftColor = group.color;

                const meaningDiv = document.createElement('div');
                meaningDiv.className = 'study-meaning'; // 此 class 已有 space-between
                meaningDiv.style.color = group.color;
                
                // 1. 建立左邊文字 Span
                const textSpan = document.createElement('span');
                textSpan.innerText = group.meaning;
                meaningDiv.appendChild(textSpan);

                // 2. 建立右邊 AI 按鈕
                const aiBtn = document.createElement('button');
                aiBtn.className = 'ai-btn';
                aiBtn.innerHTML = '✨作文點用';
                aiBtn.onclick = function() { askGemini(this, group.meaning, group.words); };
                
                meaningDiv.appendChild(aiBtn); 
                groupDiv.appendChild(meaningDiv);

                const wordsDiv = document.createElement('div');
                wordsDiv.className = 'study-words';

                group.words.forEach(w => {
                    const span = document.createElement('span');
                    span.className = 'study-tag';
                    span.style.setProperty('--pop-color', group.color);

                    let textToSpeak = (typeof w === 'string') ? w : w.t;
                    let displayHtml = (typeof w === 'string') ? w : `${w.t} <small style="color:#7f8c8d; font-weight:normal; font-size: 0.85em;">(${w.m})</small>`;

                    span.innerHTML = displayHtml;
                    span.onclick = () => {
                        speakWord(textToSpeak);
                        span.classList.remove('pop-active');
                        void span.offsetWidth;
                        span.classList.add('pop-active');
                    };
                    wordsDiv.appendChild(span);
                });

                groupDiv.appendChild(wordsDiv);
                container.appendChild(groupDiv);
            });

            document.getElementById('studyModal').classList.remove('hidden');
        }

        function toggleSearchBar() {
            const wrapper = document.getElementById('searchBarWrapper');
            const input = document.getElementById('studySearchInput');
            if (wrapper.classList.contains('open')) {
                wrapper.classList.remove('open');
                input.value = ''; filterStudyList('');
            } else {
                wrapper.classList.add('open');
                input.focus();
            }
        }

        document.getElementById('studySearchInput').addEventListener('input', function(e) {
            filterStudyList(e.target.value);
        });

        function filterStudyList(keyword) {
            const groups = document.querySelectorAll('.study-group');
            keyword = keyword.toLowerCase();
            groups.forEach(group => {
                const text = group.innerText.toLowerCase();
                if (text.includes(keyword)) group.style.display = 'block';
                else group.style.display = 'none';
            });
        }
// =========================================================
    // 🤖 打字機特效函數 (移植自 N4 Game，已適配 Synonym Game)
    // =========================================================
    async function typeWriter(element, htmlContent, speed = 10) {
        element.innerHTML = '';
        // 確保元素可見且高度自動，方便打字時撐開
        element.style.display = 'block';
        element.style.height = 'auto'; 
        
        // 1. 將 HTML 字串轉做真正的 DOM 節點
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const nodes = Array.from(tempDiv.childNodes);

        // 2. 遞歸函數：負責逐層打印
        async function typeNode(node, parent) {
            if (node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent;
                const textNode = document.createTextNode('');
                parent.appendChild(textNode);
                
                for (let i = 0; i < text.length; i++) {
                    textNode.textContent += text[i];
                    
                    // --- 自動捲動邏輯 (適配 Modal) ---
                    // 嘗試搵出最近的可捲動容器 (Modal Content)
                    const scrollableParent = element.closest('.modal-content') || element.closest('.result-list-container');
                    if (scrollableParent) {
                        // 簡單版：打字時保持捲軸在最底，確保睇到最新出的字
                        // 只有當內容超出時才捲動
                        if (scrollableParent.scrollHeight > scrollableParent.clientHeight) {
                             scrollableParent.scrollTop = scrollableParent.scrollHeight;
                        }
                    }

                    // 每一隻字停頓極短時間 (10ms 比 N4 快少少，因為這遊戲節奏較快)
                    await new Promise(r => setTimeout(r, speed));
                }
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                // 處理標籤 (h4, strong 等)
                const el = document.createElement(node.tagName);
                Array.from(node.attributes).forEach(attr => {
                    el.setAttribute(attr.name, attr.value);
                });
                parent.appendChild(el);
                
                // 繼續處理子內容
                const children = Array.from(node.childNodes);
                for (const child of children) {
                    await typeNode(child, el);
                }
            }
        }

        // 3. 開始執行
        for (const node of nodes) {
            await typeNode(node, element);
        }
    }
