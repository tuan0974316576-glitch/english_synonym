        function loadLearningProgressState() {
            const progressRef = getLearningProgressRef();
            if (!progressRef) {
                learningProgressState = { unlockedLevel: 1, awards: {} };
                return Promise.resolve(learningProgressState);
            }

            const legacy = getLegacyLearningSnapshot();

            return progressRef.once('value')
                .then(snapshot => {

                    const remoteUnlockedLevel = Number(remote.unlockedLevel || 1);
                    const mergedUnlockedLevel = Math.max(remoteUnlockedLevel, Number(legacy.unlockedLevel || 1), 1);
                    const mergedAwards = {
                        ...(legacy.awards || {}),
                        ...(remote.awards || {})
                    };

                    learningProgressState = {
                        unlockedLevel: mergedUnlockedLevel,
                        awards: mergedAwards
                    };

                    const needsMigration =
                        !snapshot.exists() ||
                        mergedUnlockedLevel !== remoteUnlockedLevel ||
                        JSON.stringify(mergedAwards) !== JSON.stringify(remote.awards || {});

        function clearResolvedMistakeWords(...entries) {
            entries.forEach(entry => {
                if (!entry || !entry.gid || !entry.word) return;
                const key = getReplayEntryKey(entry);
                delete currentRunMistakeCounts[key];
                currentRunMistakeQueue = currentRunMistakeQueue.filter(item => getReplayEntryKey(item) !== key);
            });

        function recordMistakeWords(...entries) {
            entries.forEach(entry => {
                if (!entry || !entry.gid || !entry.word) return;

                const normalizedEntry = {
                    gid: entry.gid,
                    word: entry.word,
                    color: entry.color || null
                };
                const key = getReplayEntryKey(normalizedEntry);

                currentRunMistakeCounts[key] = (currentRunMistakeCounts[key] || 0) + 1;

                if (currentRunMistakeCounts[key] >= 2) {
                    currentRunMistakeQueue = currentRunMistakeQueue.filter(item => getReplayEntryKey(item) !== key);
                    currentRunMistakeQueue.unshift(normalizedEntry);
                }
            });
        }

        function flushCurrentRunMistakesToReplayQueue() {
            if (currentRunMistakeQueue.length === 0) return saveMistakeReplayQueue();

            currentRunMistakeQueue.forEach(entry => {
                const key = getReplayEntryKey(entry);
                mistakeReplayQueue = mistakeReplayQueue.filter(item => getReplayEntryKey(item) !== key);
                mistakeReplayQueue.unshift(entry);
            });

            currentRunMistakeQueue = [];
            currentRunMistakeCounts = {};
            return saveMistakeReplayQueue();
        }

        function createPairFromGroup(group, preferredWord = null) {
            if (!group || !Array.isArray(group.words)) return null;

            const words = group.words
                .map(word => typeof word === 'string' ? { t: word, m: group.meaning } : { t: word.t, m: word.m || group.meaning })
                .filter(word => word.t);

            if (words.length < 2) return null;

            const normalizedPreferredWord = normalizeReplayWord(preferredWord);
            const anchorWord = normalizedPreferredWord
                ? words.find(word => normalizeReplayWord(word.t) === normalizedPreferredWord)
                : null;

            if (!anchorWord) {
                const shuffledWords = words.sort(() => 0.5 - Math.random());
                return { i1: shuffledWords[0], i2: shuffledWords[1], gid: group.id, c: group.color };
            }

            const partnerPool = words
                .filter(word => normalizeReplayWord(word.t) !== normalizedPreferredWord)
                .sort(() => 0.5 - Math.random());

            if (partnerPool.length === 0) return null;

            return { i1: anchorWord, i2: partnerPool[0], gid: group.id, c: group.color };
        }

        function takeMistakeReplayPairs(limit, excludedGroupIds = new Set()) {
            const replayPairs = [];
            const remainingQueue = [];

            mistakeReplayQueue.forEach(entry => {
                const groupId = typeof entry === 'string' ? entry : entry.gid;
                if (replayPairs.length >= limit || excludedGroupIds.has(groupId)) {
                    remainingQueue.push(entry);
                    return;
                }

                const group = synonymData.find(item => item.id === groupId);
                const preferredWord = typeof entry === 'string' ? null : entry.word;
                const pair = createPairFromGroup(group, preferredWord);

                if (pair) {
                    replayPairs.push(pair);
                    excludedGroupIds.add(groupId);
                } else {
                    remainingQueue.push(entry);
                }
            });

            mistakeReplayQueue = remainingQueue;
            saveMistakeReplayQueue();
            return replayPairs;
        }

        let allVoices = [];

        function speakWord(text) {
            if (!('speechSynthesis' in window)) {
                alert("浣犵殑鐎忚鍣ㄤ笉鏀彺鐧奸煶鍔熻兘");
                return;
            }
            if (allVoices.length === 0) allVoices = window.speechSynthesis.getVoices();

            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            
            let preferredVoice = allVoices.find(v => v.name.includes("Google US English")) ||
                                 allVoices.find(v => v.name.includes("Google UK English Female")) ||
                                 allVoices.find(v => v.name.includes("Microsoft Zira")) ||
                                 allVoices.find(v => v.lang === 'en-US' && !v.name.includes("Chinese")) ||
                                 allVoices.find(v => v.lang === 'en-GB');

            if (preferredVoice) u.voice = preferredVoice;
            u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1;
            window.speechSynthesis.speak(u);
        }
        loadVoices();

        function shuffleArray(arr) {
            const cloned = [...arr];
            for (let i = cloned.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
            }
            return cloned;
        }

        function pickRandomItems(arr, count, excludeValues = new Set()) {
            return shuffleArray(arr.filter(item => !excludeValues.has(item))).slice(0, count);
        }

        function getWordText(word) {
            return typeof word === 'string' ? word : word.t;
        }

        function getWordMeaning(word, fallbackMeaning) {
            return typeof word === 'string' ? fallbackMeaning : word.m;
        }

        function buildLearningWordChip(wordText, color) {
            const safeWord = wordText.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
            return `<span class="learning-word-chip" style="border:1px solid ${color}33; color:${color}; --pop-color:${color};" onclick="handleLearningWordClick(this, '${safeWord}')">${wordText}</span>`;

        function handleLearningWordClick(element, wordText) {
            playSound('select');
            speakWord(wordText);
            element.classList.remove('pop-active');
            void element.offsetWidth;
            element.classList.add('pop-active');

        function toggleLearningSynonymOption(wordText) {
            const normalized = wordText.trim().toLowerCase();
            if (currentLearningSelectedSynonyms.includes(normalized)) {
                currentLearningSelectedSynonyms = currentLearningSelectedSynonyms.filter(item => item !== normalized);
                playSound('click');
            } else {
                currentLearningSelectedSynonyms = [...currentLearningSelectedSynonyms, normalized];
                playSound('select');
            }
            renderLearningSynonymQuestion();
        }

        function buildLearningLevels() {
            const levels = [];
            for (let start = 0; start < synonymData.length; start += 14) {
                const chunk = synonymData.slice(start, start + 14);
                const odd = chunk.filter((_, index) => index % 2 === 0);
                const even = chunk.filter((_, index) => index % 2 === 1);
                if (odd.length) levels.push(odd);
                if (even.length) levels.push(even);
            }
            return levels;
        }

        function getLearningLevelGroups(levelIndex) {
            if (!learningLevels.length) learningLevels = buildLearningLevels();
            const coreGroups = learningLevels[levelIndex] || [];
            const previousPool = learningLevels.slice(0, levelIndex).flat();
            const reviewGroups = pickRandomItems(previousPool, Math.min(3, previousPool.length));
            return [...coreGroups, ...reviewGroups];
        }

        function getLearningProgress() {
            if (!learningLevels.length) learningLevels = buildLearningLevels();
            const rawValue = Number(learningProgressState.unlockedLevel || 1);
            return Math.min(Math.max(rawValue, 1), learningLevels.length + 1);
        }

        function setLearningProgress(levelNumber) {
            learningProgressState.unlockedLevel = levelNumber;
            saveLearningProgressState();
        }

        function getLearningAwards() {
            return learningProgressState.awards || {};
        }

        function saveLearningAwards(awards) {
            learningProgressState.awards = awards || {};
            saveLearningProgressState();
        }

        function getLearningRunSummary() {
            return {
                quizMistakes: currentLearningRunStats?.quizMistakes || 0,
                cardMistakes: currentLearningRunStats?.cardMistakes || 0,
                perfect: (currentLearningRunStats?.quizMistakes || 0) === 0 && (currentLearningRunStats?.cardMistakes || 0) === 0
            };
        }

        function getTotalVocabCount() {
            return synonymData.reduce((total, group) => total + group.words.length, 0);
        }

        function getMasteredVocabCount() {
            if (!learningLevels.length) learningLevels = buildLearningLevels();
            const completedLevels = Math.min(learningLevels.length, Math.max(0, getLearningProgress() - 1));
            const masteredCount = learningLevels
                .slice(0, completedLevels)
                .reduce((total, levelGroups) => {
                    return total + levelGroups.reduce((groupTotal, group) => groupTotal + group.words.length, 0);
                }, 0);
            return Math.min(getTotalVocabCount(), masteredCount);
        }

        function getOrdinalSuffix(num) {
            const mod10 = num % 10;
            const mod100 = num % 100;
            if (mod10 === 1 && mod100 !== 11) return 'st';
            if (mod10 === 2 && mod100 !== 12) return 'nd';
            if (mod10 === 3 && mod100 !== 13) return 'rd';
            return 'th';
        }

        function formatRankLabel(rank) {
            if (!rank || typeof rank !== 'number') return '--';
            const text = `${rank}${getOrdinalSuffix(rank)}`;
            if (rank === 1) return `<span class="rank-pill gold">馃憫 ${text}</span>`;
            if (rank === 2) return `<span class="rank-pill silver">馃憫 ${text}</span>`;
            if (rank >= 3 && rank <= 10) return `<span class="rank-pill bronze">馃憫 ${text}</span>`;
            return `<span class="rank-pill default">${text}</span>`;
        }

        function isGameplayInfoMode() {
            return currentMode === 'classic' || currentMode === 'learning-card';

        function renderTopInfoBar() {
            const gameStatsGroup = document.getElementById('gameStatsGroup');
            const overviewStatsGroup = document.getElementById('overviewStatsGroup');
            if (!gameStatsGroup || !overviewStatsGroup) return;

            if (isGameplayInfoMode()) {
                gameStatsGroup.style.display = 'flex';
                overviewStatsGroup.style.display = 'none';
            } else {
                gameStatsGroup.style.display = 'none';
                overviewStatsGroup.style.display = 'flex';
                document.getElementById('mastered-vocab-display').innerText = `[${getMasteredVocabCount()} / ${getTotalVocabCount()}]`;
                document.getElementById('best-score-display').innerText = currentPlayerBestScore || 0;
                document.getElementById('best-rank-display').innerHTML = formatRankLabel(currentPlayerBestRank);
            }
        }

        function getUniqueScores(rawScores) {
            const uniqueMap = {};
            rawScores.forEach(item => {
                if (!item || !item.name) return;
                if (!uniqueMap[item.name] || item.score > uniqueMap[item.name].score) {
                    uniqueMap[item.name] = item;
                }
            });
            return Object.values(uniqueMap).sort((a, b) => b.score - a.score);
        }

        function syncCurrentPlayerProfile(uniqueScores) {
            const me = uniqueScores.findIndex(item => item.name === currentPlayer);
            if (me >= 0) {
                currentPlayerBestScore = uniqueScores[me].score || 0;
                currentPlayerBestRank = me + 1;
            } else {
                currentPlayerBestScore = 0;
                currentPlayerBestRank = null;
            }
            renderTopInfoBar();
        }

        function refreshPlayerProfileStats() {
            if (!db || !currentPlayer) {
                renderTopInfoBar();
                return;
            }
            db.ref(LEADERBOARD_PATH).orderByChild('score').once('value', snapshot => {
                const rawScores = [];
                snapshot.forEach(child => rawScores.push(child.val()));
                syncCurrentPlayerProfile(getUniqueScores(rawScores));
            }).catch(() => {
                renderTopInfoBar();
            });
        }

        function goToLearningMap() {
            if (!currentPlayer) return;
            playSound('stage');

            clearInterval(timer);
            currentMode = 'learning-map';
            activeGameGroups = null;
            useFiniteDeck = false;
            if (!learningLevels.length) learningLevels = buildLearningLevels();

            const progress = getLearningProgress();
            const awards = getLearningAwards();
            const completedCount = Math.min(learningLevels.length, Math.max(0, progress - 1));
            const nodesHtml = learningLevels.map((groups, index) => {
                const levelNumber = index + 1;
                const isCompleted = progress > learningLevels.length ? true : levelNumber < progress;
                const isCurrent = progress <= learningLevels.length && levelNumber === progress;
                const isLocked = levelNumber > progress;
                const award = awards[String(levelNumber)];
                const positionClass = index % 2 === 0 ? 'left' : 'right';
                const stateClass = isCurrent ? 'current' : isCompleted ? 'completed' : isLocked ? 'locked' : '';
                const clickAction = isLocked ? '' : `onclick="startLearningLevel(${index})"`;
                const rewardHtml = award ? `
                    <div class="route-rewards">
                        <span class="route-reward clear" title="閬庨棞">馃弲</span>
                        ${award.perfect ? '<span class="route-reward perfect" title="瀹岀編閫氶棞">馃憫</span>' : ''}
                    </div>
                ` : '';

                return `
                    <div class="route-stop ${positionClass} ${stateClass}">
                        <div class="route-milestone"></div>
                        <div class="route-stop-card">
                            <button class="route-node ${stateClass}" ${clickAction} ${isLocked ? 'disabled' : ''}>
                                <span class="route-number">${levelNumber}</span>

                    </div>

                <div class="learning-map-wrap">

                    <div class="learning-map">${nodesHtml}</div>
                </div>
                <div class="learning-actions">
                </div>
            `);
        }

        function resetLearningState() {
            learningLevels = [];
            learningCoreGroups = [];
            learningGroups = [];
            learningQuizQueue = [];
            learningQuizIndex = 0;
            learningQuizState = null;
            currentLearningLevelIndex = null;
            currentLearningRunStats = null;
            activeGameGroups = null;
            useFiniteDeck = false;

            goToLearningMap();

        function startLearningLevel(levelIndex) {
            if (!learningLevels.length) learningLevels = buildLearningLevels();
            const progress = getLearningProgress();
            if (levelIndex + 1 > Math.min(progress, learningLevels.length)) return;

            playSound('stage');
            closeModal('rankModal');
            document.getElementById('resultModal').classList.add('hidden');
            clearInterval(timer);

            currentMode = 'learning-study';
            currentLearningLevelIndex = levelIndex;
            currentLearningRunStats = {
                quizMistakes: 0,
                cardMistakes: 0
            };
            activeGameGroups = null;
            useFiniteDeck = false;
            learningCoreGroups = learningLevels[levelIndex] || [];
            learningGroups = getLearningLevelGroups(levelIndex);
            learningQuizQueue = shuffleArray(learningGroups.map(group => {
                const words = shuffleArray(group.words.map(getWordText));
                return {
                    groupId: group.id,
                    targetWord: words[0],
                    correctMeaning: group.meaning,
                    correctSynonyms: words.filter(word => word !== words[0])
                };
            }));
            learningQuizIndex = 0;
            learningQuizState = null;
            currentLearningSelectedSynonyms = [];

            document.getElementById('startOverlay').style.display = 'none';
            document.getElementById('preGameButtons').style.display = 'none';
            document.getElementById('inGameButtons').style.display = 'none';
            renderTopInfoBar();
            renderLearningStudyStep();

        function startLearningQuizOne() {

        function renderLearningMeaningQuestion(feedback = '', isError = false) {
            const item = learningQuizQueue[learningQuizIndex];
            const group = learningGroups.find(entry => entry.id === item.groupId);
            const distractors = pickRandomItems(
                learningGroups.map(entry => entry.meaning),
                5,
                new Set([group.meaning])
            );
            const options = shuffleArray([group.meaning, ...distractors]);
            learningQuizState = { phase: 'meaning', item, group, meaningOptions: options, synonymOptions: null };

            showLearningPanel(`
                <div class="learning-question-box">
                    <div class="learning-progress">STEP 2 / 3 路 QUIZ 1 路 ${learningQuizIndex + 1} / ${learningQuizQueue.length}</div>
                    <div class="learning-prompt">銆?{item.targetWord}銆嶄總閭婂€嬩腑鏂囨剰鎬濓紵</div>
                    <div class="learning-help"></div>
                    <div class="learning-options">
                        ${options.map(option => `<button class="option-btn" onclick="handleLearningMeaningAnswer('${option.replace(/'/g, "\\'")}')">${option}</button>`).join('')}
                    </div>
                    <div class="learning-feedback ${isError ? 'error' : 'success'}">${feedback}</div>
                    <div class="learning-actions">
                    </div>
                </div>
            `);
        }

        function handleLearningMeaningAnswer(selectedMeaning) {
            const { group, item } = learningQuizState;
            if (selectedMeaning !== group.meaning) {
                if (currentLearningRunStats) currentLearningRunStats.quizMistakes++;
                playSound('fail');
                renderLearningMeaningQuestion(`鏈暠锛屽啀瑭︿竴娆°€傛彁绀猴細${item.targetWord} 灞柤浣犲暠鍟辨韩閬庡槄鍏朵腑涓€绲勩€俙, true);
                return;
            }
            playSound('match');
            playSound('confirm');
            currentLearningSelectedSynonyms = [];
            renderLearningSynonymQuestion();
        }

        function renderLearningSynonymQuestion(feedback = '', isError = false) {
            const { group, item } = learningQuizState;
            let options = learningQuizState.synonymOptions;
            if (!options) {
                const distractorPool = learningGroups
                    .filter(entry => entry.id !== group.id)
                    .flatMap(entry => entry.words.map(getWordText));
                const distractorCount = Math.max(0, Math.min(12 - item.correctSynonyms.length, distractorPool.length));
                options = shuffleArray([
                    ...item.correctSynonyms,
                    ...pickRandomItems(distractorPool, distractorCount, new Set([item.targetWord, ...item.correctSynonyms]))

        function isFcmReady() {
            return Boolean(
                window.firebase &&
                firebase.messaging &&
                'Notification' in window &&
                'serviceWorker' in navigator &&
                'PushManager' in window &&
                FCM_VAPID_PUBLIC_KEY &&
                !FCM_VAPID_PUBLIC_KEY.includes('PASTE_YOUR')
            );

        function hashFcmToken(token) {
            let hash = 0;
            for (let i = 0; i < token.length; i++) {
                hash = ((hash << 5) - hash) + token.charCodeAt(i);
                hash |= 0;
            }
            return `token_${Math.abs(hash)}`;
        }

        function getFcmDevicePayload(token) {
            return {
                token,
                platform: navigator.platform || 'unknown',
                userAgent: navigator.userAgent || 'unknown',
                lastSeenAt: firebase.database.ServerValue.TIMESTAMP
            };
        }

        function saveFcmToken(token) {
            const ref = getFcmTokensRef();
            if (!ref || !token) return Promise.resolve();
            const key = hashFcmToken(token);
            return ref.child(key).update(getFcmDevicePayload(token)).catch(error => {
                console.error('[FCM] Failed to save token:', error);
            });
        }

        function getMessagingRegistration() {
            if (messagingRegistrationPromise) return messagingRegistrationPromise;
            if (!('serviceWorker' in navigator)) return Promise.reject(new Error('serviceWorker unsupported'));
            messagingRegistrationPromise = navigator.serviceWorker.register('./sw.js');
            return messagingRegistrationPromise;
        }

        function getMessagingClient() {
            if (messagingClient) return messagingClient;
            if (!isFcmReady()) return null;
            try {
                messagingClient = firebase.messaging();
                return messagingClient;
            } catch (error) {
                console.error('[FCM] Messaging init failed:', error);
                return null;
            }
        }

        function generateMasterDeck(excludedGroupIds = new Set(), sourceGroups = synonymData) {
            let tempDeck = [];
            sourceGroups.forEach(g => {
                if (excludedGroupIds.has(g.id)) return;
                let ws = g.words.map(w => (typeof w === 'string') ? {t:w, m:g.meaning} : {t:w.t, m:w.m});
                ws.sort(() => 0.5 - Math.random());
                for (let i = 0; i < ws.length - 1; i += 2) {
                    tempDeck.push({ i1: ws[i], i2: ws[i+1], gid: g.id, c: g.color });
                }
            });
            return tempDeck.sort(() => 0.5 - Math.random());
        }

        function isSynonymPair(wordA, wordB) {
            if (!wordA || !wordB) return false;
            const wa = wordA.toLowerCase();
            const wb = wordB.toLowerCase();
            if (wa === wb) return true;
            for (let group of synonymData) {
                const wordsInGroup = group.words.map(w => (typeof w === 'string' ? w : w.t).toLowerCase());
                if (wordsInGroup.includes(wa) && wordsInGroup.includes(wb)) return true; 
            }
            return false;
        }

        function unflipCards() {
            lockBoard = true; 
            const c1 = firstCard;
            const c2 = secondCard;

            if (currentMode === 'learning-card' && currentLearningRunStats) {
                currentLearningRunStats.cardMistakes++;

            recordMistakeWords(
                { gid: c1.dataset.group, word: c1.dataset.word, color: c1.dataset.color },
                { gid: c2.dataset.group, word: c2.dataset.word, color: c2.dataset.color }
            );
            
            [c1, c2].forEach(c => {
                let cnt = parseInt(c.dataset.failCount||1)+1; 
                c.dataset.failCount = cnt;
                let w = c.dataset.word;
                let rawHint = w.substring(0, Math.min(cnt, w.length));
                let hint = rawHint.charAt(0).toUpperCase() + rawHint.slice(1);
                let b = c.querySelector('.card-back'); 
                if(b) {
                    b.innerText = hint;
                    b.style.fontSize = hint.length>3?'1rem':(hint.length>1?'1.5rem':'2.5rem');
                    b.style.background = "linear-gradient(135deg, #5b6ebf 0%, #683e91 100%)";
                }
            });

            lives--; 
            updateUI();

            if (lives === 0) {
                revealAndEndGame('HP 姝搁浂'); 
                return;
            }

            setTimeout(() => { 
                playSound('fail'); 
                c1.classList.add('shake'); 
                c2.classList.add('shake'); 
            }, 400);
            
            setTimeout(() => { 
                c1.classList.remove('flipped','shake'); 
                c2.classList.remove('flipped','shake'); 
                resetBoard(); 
            }, 1200);
        }

        function calculateMyRank() {
            lastGameRank = "...";

                for (let i = 0; i < uniqueScores.length; i++) {
                    if (uniqueScores[i].name === currentPlayer) {
                        myRank = i + 1;
                        lastGameBestScoreUsed = uniqueScores[i].score || 0;
                        break;
                    }

                lastGameRank = myRank;

// =========================================================
    // 馃 鎵撳瓧姗熺壒鏁堝嚱鏁?(绉绘鑷?N4 Game锛屽凡閬╅厤 Synonym Game)
    // =========================================================
    async function typeWriter(element, htmlContent, speed = 10) {
        element.innerHTML = '';
        // 纰轰繚鍏冪礌鍙涓旈珮搴﹁嚜鍕曪紝鏂逛究鎵撳瓧鏅傛拹闁?
        element.style.display = 'block';
        element.style.height = 'auto'; 
        
        // 1. 灏?HTML 瀛椾覆杞夊仛鐪熸鐨?DOM 绡€榛?
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const nodes = Array.from(tempDiv.childNodes);

        // 2. 閬炴鍑芥暩锛氳矤璨€愬堡鎵撳嵃
        async function typeNode(node, parent) {
            if (node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent;
                const textNode = document.createTextNode('');
                parent.appendChild(textNode);
                
                for (let i = 0; i < text.length; i++) {
                    textNode.textContent += text[i];
                    
                    // --- 鑷嫊鎹插嫊閭忚集 (閬╅厤 Modal) ---
                    // 鍢楄│鎼靛嚭鏈€杩戠殑鍙嵅鍕曞鍣?(Modal Content)
                    const scrollableParent = element.closest('.modal-content') || element.closest('.result-list-container');
                    if (scrollableParent) {
                        // 绨″柈鐗堬細鎵撳瓧鏅備繚鎸佹嵅杌稿湪鏈€搴曪紝纰轰繚鐫囧埌鏈€鏂板嚭鐨勫瓧
                        // 鍙湁鐣跺収瀹硅秴鍑烘檪鎵嶆嵅鍕?
                        if (scrollableParent.scrollHeight > scrollableParent.clientHeight) {
                             scrollableParent.scrollTop = scrollableParent.scrollHeight;
                        }
                    }

                    // 姣忎竴闅诲瓧鍋滈爴妤电煭鏅傞枔 (10ms 姣?N4 蹇皯灏戯紝鍥犵偤閫欓亰鎴茬瘈濂忚純蹇?
                    await new Promise(r => setTimeout(r, speed));
                }
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                // 铏曠悊妯欑堡 (h4, strong 绛?
                const el = document.createElement(node.tagName);
                Array.from(node.attributes).forEach(attr => {
                    el.setAttribute(attr.name, attr.value);
                });
                parent.appendChild(el);
                
                // 绻肩簩铏曠悊瀛愬収瀹?
                const children = Array.from(node.childNodes);
                for (const child of children) {
                    await typeNode(child, el);
                }
            }
        }

        // 3. 闁嬪鍩疯
        for (const node of nodes) {
            await typeNode(node, element);
        }
    }
